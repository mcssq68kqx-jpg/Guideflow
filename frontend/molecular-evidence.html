<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分子证据 · Guideflow</title>
  <link rel="stylesheet" href="./styles.css?v=20260831-me-rewrite" />
  <style>
    :root{
      --brand:#E8654A;
      --brand-deep:#D0523A;
      --brand-soft:#FDEDE7;
      --brand-softer:#FEF4F0;
      --bg:#FFFFFF;
      --sidebar-bg:#F7F5F2;
      --border:#ECE8E2;
      --border-strong:#E0DBD4;
      --text:#1F1C1A;
      --text-2:#6B6660;
      --text-3:#9C968E;
      --card:#FFFFFF;
      --field-bg:#FAF8F5;
      --warn-bg:#FEF6E4;
      --warn-line:#F0E2B8;
      --warn-text:#8A6416;
      --danger-soft:#FBEAEA;
      --danger-text:#B23A32;
      --ok-bg:#EAF6EF;
      --ok-text:#1D6D43;
      --radius:14px;
      --shadow:0 1px 2px rgba(40,30,20,.04), 0 4px 16px rgba(40,30,20,.04);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:auto;min-height:100%}
    body{
      font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      color:var(--text);background:var(--bg);
      font-size:14px;line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--brand-deep);text-decoration:none}
    /* 全局 styles.css 把 .app/.main/.sidebar 定义成 100vh grid + overflow:hidden，
       在分子证据页会锁死整页滚动。这里把它们还原为原型期望的自然文档流布局。 */
    body .app{display:flex;min-height:100vh;height:auto;overflow:visible}
    body .sidebar{position:sticky;display:flex;overflow-y:auto}
    body .main{display:flex;flex-direction:column;min-width:0;min-height:100vh;overflow:visible;background:var(--bg)}
    .app{display:flex;min-height:100vh}

    /* ============ 侧边栏 ============ */
    .sidebar{
      width:256px;flex:0 0 256px;background:var(--sidebar-bg);
      border-right:1px solid var(--border);
      display:flex;flex-direction:column;padding:18px 14px;
      position:sticky;top:0;height:100vh;overflow-y:auto;
    }
    .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
    .brand .logo{
      width:36px;height:36px;border-radius:10px;background:var(--brand);
      color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;
    }
    .brand .name{font-weight:700;font-size:15px;line-height:1.15}
    .brand .sub{font-size:11.5px;color:var(--text-3)}
    .brand .back{
      margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
      background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;text-decoration:none;flex:0 0 30px;font-family:inherit;
    }
    .brand .back:hover{color:var(--brand);border-color:var(--brand)}
    /* 侧边栏收起：隐藏侧栏，主区占满；左上角出现展开按钮 */
    .app.sidebar-collapsed .sidebar{display:none}
    .sidebar-expand{
      position:fixed;left:12px;top:14px;z-index:60;
      width:30px;height:30px;border-radius:8px;border:1px solid var(--border);
      background:#fff;display:none;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;
      box-shadow:var(--shadow);font-family:inherit;
    }
    .sidebar-expand:hover{color:var(--brand);border-color:var(--brand)}
    .app.sidebar-collapsed .sidebar-expand{display:flex}
    .newchat{
      display:flex;align-items:center;justify-content:center;gap:6px;
      background:#fff;border:1px solid var(--border);border-radius:10px;
      padding:9px 12px;font-size:13.5px;color:var(--text);cursor:pointer;margin-bottom:14px;width:100%;font-family:inherit;
    }
    .newchat:hover{border-color:var(--brand);color:var(--brand)}
    .hist-label{font-size:12px;color:var(--text-3);padding:0 8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
    .hist-label button{background:none;border:none;color:var(--text-3);font-size:11.5px;cursor:pointer;font-family:inherit}
    .hist-label button:hover{color:var(--danger-text)}
    .hist-group{margin-bottom:8px;display:flex;flex-direction:column;gap:2px}
    .hist-item{
      padding:7px 10px;border-radius:8px;font-size:13px;color:var(--text-2);
      cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;
    }
    .hist-item:hover{background:#fff}
    .hist-item.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:500}
    .hist-item .hm{display:block;font-size:11px;color:var(--text-3);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hist-empty{font-size:12.5px;color:var(--text-3);padding:6px 10px}
    .sidebar .foot{margin-top:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
    .login{
      width:100%;background:#fff;border:1px solid var(--border);border-radius:10px;
      padding:8px;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;
    }
    .login:hover{border-color:var(--brand);color:var(--brand)}

    /* ============ 主区 ============ */
    .main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
    .topbar{display:flex;align-items:center;gap:14px;padding:16px 32px 10px}
    .topbar h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar .actions{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
    .icon-btn{
      width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;
      display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;font-family:inherit;font-size:13px;
    }
    .icon-btn:hover{color:var(--brand);border-color:var(--brand)}

    .statusbar{display:flex;align-items:center;gap:10px;padding:0 32px 14px;flex-wrap:wrap}
    .chip{
      display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;
      padding:3px 10px;border-radius:999px;white-space:nowrap;
    }
    .chip.warn{background:var(--warn-bg);color:var(--warn-text)}
    .chip.brand{background:var(--brand-soft);color:var(--brand-deep)}
    .chip.gray{background:#F1EEE9;color:var(--text-2)}
    .chip.ok{background:var(--ok-bg);color:var(--ok-text)}
    .chip.bad{background:var(--danger-soft);color:var(--danger-text)}
    .meta{font-size:12.5px;color:var(--text-3)}

    .content{flex:1;padding:8px 32px 32px;max-width:920px;width:100%;margin:0 auto}

    .card{
      background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;
    }
    .card-title{font-size:15px;font-weight:700;margin-bottom:4px}
    .card-sub{font-size:12.5px;color:var(--text-3);margin-bottom:14px}

    /* ============ 结果区：渐进披露 ============ */
    .me-block{border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
    .me-head{display:flex;align-items:flex-start;gap:8px;padding:11px 14px;cursor:pointer;user-select:none}
    .me-head:hover{background:#FCFAF8}
    .me-chev{margin-left:auto;flex:0 0 auto;color:var(--text-3);transition:transform .2s}
    .me-block.open .me-chev{transform:rotate(90deg)}
    .me-body{display:none;padding:10px 14px 13px;border-top:1px solid var(--border);font-size:12.5px;line-height:1.7;color:var(--text-2)}
    .me-block.open .me-body{display:block}
    .me-line{margin-bottom:5px}
    .me-line:last-child{margin-bottom:0}
    .me-k{color:var(--text-3);display:inline-block;min-width:60px}
    .me-more{font-size:11.5px;color:var(--text-3);white-space:nowrap;flex:0 0 auto}

    /* 结论卡 */
    .me-verdict{border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px 16px;margin-bottom:8px}
    .me-lead{font-size:14px;line-height:1.75;color:var(--text);margin-bottom:12px}
    .me-lead b{font-weight:700}
    .me-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .me-stat{background:var(--field-bg);border:1px solid var(--border);border-radius:10px;padding:8px 11px;min-width:0}
    .me-stat .k{font-size:11.5px;color:var(--text-3)}
    .me-stat .v{font-size:19px;font-weight:700;line-height:1.35}
    .me-stat .v.ok{color:var(--ok-text)}
    .me-stat .v.warn{color:var(--warn-text)}

    /* 变异卡 */
    .me-gene{font-weight:700;font-size:13.5px;flex:0 0 auto}
    .me-pos{color:var(--text-3);font-weight:400}
    .me-role{font-size:11.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}

    /* 筛选 */
    .me-filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
    .me-filters button{
      border:1px solid var(--border);background:#fff;color:var(--text-2);
      border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;font-family:inherit;
    }
    .me-filters button:hover{border-color:var(--brand);color:var(--brand)}
    .me-filters button.active{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep);font-weight:500}

    /* 证据卡 */
    .me-badge{font-size:11px;padding:1px 7px;border-radius:5px;white-space:nowrap;flex:0 0 auto;font-weight:500;margin-top:1px}
    .me-badge.p{background:#F0ECF7;color:#5840b3}
    .me-badge.l{background:#F1EEE9;color:var(--text-2)}
    .me-badge.direct{background:var(--ok-bg);color:var(--ok-text)}
    .me-badge.proxy{background:#F1EEE9;color:var(--text-2)}
    .me-badge.note{background:#EAF2F8;color:#0c6a88}
    .me-claim{font-size:12.5px;line-height:1.6;color:var(--text);min-width:0;flex:1}

    /* 安全条 */
    .me-warn{background:var(--warn-bg);border-color:var(--warn-line)}
    .me-warn .me-head{align-items:center;color:var(--warn-text);font-size:12.5px;line-height:1.55}
    .me-warn .me-head:hover{background:transparent}
    .me-warn .me-body{border-top-color:var(--warn-line);color:var(--warn-text)}
    .me-warn .me-k{color:var(--warn-text);opacity:.75}

    /* 脚注与空态 */
    .me-foot{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--text-3);flex-wrap:wrap}
    .me-foot .btn{margin-left:auto}
    .me-empty{font-size:12.5px;color:var(--text-3);line-height:1.7;padding:4px 2px}
    .me-md{line-height:1.75;font-size:13px}
    .me-md h2,.me-md h3{font-size:13.5px;margin:10px 0 5px;color:var(--text)}
    .me-md ul{padding-left:18px}
    .me-md li{margin:3px 0}

    /* 底部输入 */
    .composer{padding:20px 32px;background:#fff;border-top:1px solid var(--border);position:sticky;bottom:0;z-index:30}
    .composer-box{
      max-width:920px;margin:0 auto;background:#fff;border:1px solid var(--border-strong);
      border-radius:18px;box-shadow:var(--shadow);padding:14px 16px 10px;position:relative;
    }
    .composer-box textarea{
      width:100%;border:none;outline:none;font-size:14.5px;font-family:inherit;resize:none;
      color:var(--text);background:transparent;min-height:26px;height:30px;max-height:160px;line-height:1.55;
    }
    .composer-box textarea::placeholder{color:var(--text-3)}
    .composer-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
    .composer-meta .chip{cursor:pointer;border:1px solid transparent}
    .composer-meta .chip:hover{border-color:var(--brand)}
    .composer-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
    .round-btn{
      width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:#fff;
      display:flex;align-items:center;justify-content:center;color:var(--text-2);cursor:pointer;font-size:18px;line-height:1;font-family:inherit;
    }
    .round-btn:hover{border-color:var(--brand);color:var(--brand)}
    .round-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-size:16px}
    .round-btn.primary:hover{background:var(--brand-deep)}
    .round-btn:disabled{opacity:.6;cursor:wait}
    .composer-hint{text-align:center;font-size:11.5px;color:var(--text-3);margin-top:10px;max-width:920px;margin-left:auto;margin-right:auto}
    .composer-hint.err{color:var(--danger-text);font-weight:600}
    .composer-settings{position:absolute;left:14px;bottom:calc(100% + 10px);z-index:50;width:min(480px,calc(100vw - 40px))}
    .settings-panel{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;
      border:1px solid var(--border-strong);border-radius:14px;background:#fff;box-shadow:0 16px 44px rgba(40,30,20,.16);
    }
    .settings-panel label{display:flex;flex-direction:column;gap:5px;color:var(--text-2);font-size:12px}
    .settings-panel input,.settings-panel select{
      width:100%;border:1px solid var(--border);border-radius:10px;padding:8px 10px;
      font:inherit;font-size:13px;color:var(--text);background:#fff;outline:none;
    }
    .settings-panel input:focus,.settings-panel select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

    .empty-wrap{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--text-3);background:#fff;margin-bottom:16px}
    .empty-wrap strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

    #toast{
      position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);
      background:#2b2724;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
      opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media (max-width:960px){
      .sidebar{display:none}
      .kv-row{grid-template-columns:1fr}
      .me-stats{grid-template-columns:1fr}
      .content{padding:8px 16px 24px}
      .topbar{padding:14px 16px 8px}
      .statusbar{padding:0 16px 10px}
      .composer{padding:12px 14px 14px}
    }
  </style>
</head>
<body>
<button class="sidebar-expand" id="sidebarExpandBtn" title="展开侧边栏" type="button" aria-label="展开侧边栏">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
</button>
<div class="app" id="appRoot">

  <!-- ============ 侧边栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">G</div>
      <div>
        <div class="name">Guideflow</div>
        <div class="sub">DLBCL 问答系统</div>
      </div>
      <button class="back" id="sidebarCollapseBtn" title="收起侧边栏" type="button" aria-label="收起侧边栏" aria-expanded="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <button class="newchat" id="newChatBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      开启新对话
    </button>

    <div class="hist-label"><span>历史记录</span><button id="clearHistoryBtn" type="button">清空</button></div>
    <div class="hist-group" id="historyList"></div>

    <div class="foot"><button class="login" id="loginBtn" type="button">登录 / 注册</button></div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <div class="topbar">
      <h1 id="topTitle">分子证据 · 等待查询</h1>
      <div class="actions">
        <button class="icon-btn" id="shareBtn" title="分享" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>
        </button>
        <button class="icon-btn" id="historyToggleBtn" title="查询历史" type="button">史</button>
        <a class="icon-btn" title="前台" href="./index.html">前</a>
      </div>
    </div>

    <div class="statusbar">
      <span class="chip gray" id="heroStateBadge">等待查询</span>
      <span class="meta" id="heroMeta">输入分子信息，例如 MYD88 p.L265P, CD79B p.Y196H…</span>
    </div>

    <div class="content" id="content">
      <div class="empty-wrap" id="emptyState">
        <strong>等待输入分子信息</strong>
        <span>请在下方粘贴文字或上传基因测序报告图片，完成后点击发送。</span>
      </div>
      <div id="resultStack" hidden></div>
    </div>

    <!-- 底部输入 -->
    <div class="composer">
      <div class="composer-box">
        <textarea id="composerText" rows="1" placeholder="输入分子信息，例如 MYD88 p.L265P, CD79B p.Y196H…"></textarea>
        <div class="composer-meta">
          <span class="chip gray" id="diseaseChip">疾病 DLBCL</span>
          <span class="chip gray" id="sampleChip">样本 tumor tissue</span>
          <span class="chip gray" id="modeChip">模式 live</span>
          <div class="composer-actions">
            <button class="round-btn" id="composerAddBtn" type="button" title="上传报告图片">+</button>
            <button class="round-btn primary" id="composerSendBtn" type="button" title="发送">➤</button>
          </div>
        </div>
        <div class="composer-settings" id="settingsPanel" hidden>
          <div class="settings-panel">
            <label>疾病
              <select id="disease">
                <option value="DLBCL" selected>DLBCL</option>
                <option value="LBCL">LBCL</option>
                <option value="Follicular lymphoma">Follicular lymphoma</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label>样本类型
              <select id="sampleType">
                <option value="tumor tissue" selected>tumor tissue</option>
                <option value="bone marrow">bone marrow</option>
                <option value="peripheral blood">peripheral blood</option>
                <option value="cfDNA">cfDNA</option>
              </select>
            </label>
            <label>GRCh 版本
              <select id="genomeBuild">
                <option value="">未提供</option>
                <option value="GRCh37">GRCh37</option>
                <option value="GRCh38">GRCh38</option>
              </select>
            </label>
            <label>转录本
              <input id="transcript" placeholder="例如：NM_002468.6" />
            </label>
            <label>变异类型
              <input id="variantType" placeholder="SNV / fusion / amplification" />
            </label>
            <label>数据源模式
              <select id="providerMode">
                <option value="live" selected>在线检索（5 库）</option>
                <option value="hybrid">混合检索（在线 + 本地示例）</option>
                <option value="mock">本地测试（模拟）</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div class="composer-hint" id="composerStatus">回车发送 · Shift+回车换行 · 可上传报告图片自动识别</div>
      <input id="reportImageInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,application/pdf" hidden />
    </div>

  </main>
</div>

<div id="toast"></div>

  <script src="./vendor/marked.min.js?v=20260814"></script>
  <script src="./vendor/purify.min.js?v=20260814"></script>
  <script>
    (function () {
      'use strict';

      function guideflowDefaultApiBase() {
        var path = location.pathname || '';
        if (path.indexOf('/app') === 0 || location.port === '8001') return '';
        return 'http://127.0.0.1:8001';
      }
      const API_BASE = window.API_BASE ?? guideflowDefaultApiBase();
      const $ = (id) => document.getElementById(id);
      const els = {
        topTitle: $('topTitle'),
        heroStateBadge: $('heroStateBadge'),
        heroMeta: $('heroMeta'),
        emptyState: $('emptyState'),
        resultStack: $('resultStack'),
        historyList: $('historyList'),
        clearHistoryBtn: $('clearHistoryBtn'),
        newChatBtn: $('newChatBtn'),
        loginBtn: $('loginBtn'),
        shareBtn: $('shareBtn'),
        historyToggleBtn: $('historyToggleBtn'),
        sidebarCollapseBtn: $('sidebarCollapseBtn'),
        sidebarExpandBtn: $('sidebarExpandBtn'),
        composerText: $('composerText'),
        composerSendBtn: $('composerSendBtn'),
        composerAddBtn: $('composerAddBtn'),
        composerStatus: $('composerStatus'),
        settingsPanel: $('settingsPanel'),
        reportImageInput: $('reportImageInput'),
        disease: $('disease'),
        sampleType: $('sampleType'),
        genomeBuild: $('genomeBuild'),
        transcript: $('transcript'),
        variantType: $('variantType'),
        providerMode: $('providerMode'),
        diseaseChip: $('diseaseChip'),
        sampleChip: $('sampleChip'),
        modeChip: $('modeChip'),
      };

      const HISTORY_KEY = 'gf_molecular_evidence_history_v3';
      const HISTORY_LIMIT = 30;
      const state = { lastPayload: null, history: [], cardFilter: 'all', openBlocks: new Set() };

      /* ---------------- 工具函数 ---------------- */
      function toast(msg){
        var t = $('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1600);
      }
      function escapeHtml(text) {
        return String(text ?? '').replace(/[&<>"']/g, (s) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',

      }
      function normalizeWarnings(list) { return Array.isArray(list) ? list.filter(Boolean) : []; }
      function api(path, options = {}) {

      function setError(msg) {
        els.composerStatus.textContent = msg || '回车发送 · Shift+回车换行 · 可上传报告图片自动识别';

      }

      const UI_TRANSLATIONS = {
        unique: '唯一匹配', protein_level_only: '仅蛋白层匹配', ambiguous: '存在歧义', insufficient: '信息不足', conflicting: '存在冲突',
        allow: '允许', downgrade: '保守使用', ask_for_confirmation: '需要确认', refuse: '拒绝输出',

        accepted: '已接受', submitted: '已提交，尚待审核', supported: '有证据支持', verified: '已核验', curated: '已人工整理', mock_accepted: '本地示例', mock: '本地示例',
        supports: '支持', does_not_support: '不支持', database_record: '数据库记录',

        success: '成功', no_evidence: '无证据', degraded: '受限', incomplete: '不完整', pending: '待执行',

        evidence_supported_contextual_claim: '有证据支持的语境化结论',
        literature_lead_or_database_signal_only: '仅线索参考（摘要/数据库信号）',
        extrapolation_only: '仅外推参考',
        conflicted_evidence: '存在冲突，结论保守',

        patient_level_treatment_plan: '患者级治疗方案',
        individual_prognosis_prediction: '个体预后预测',
        drug_dose: '药物剂量',
        definitive_diagnosis: '明确诊断',
        patient_level_prognosis: '患者级预后',
        infer_targetability_from_oncogenicity: '由致癌性推断靶向药',
        treatment_recommendation: '治疗推荐',
        diagnosis: '诊断',
      };
      function zh(value) {
        if (value === null || value === undefined || value === '') return '-';
        const text = String(value);
        const direct = UI_TRANSLATIONS[text.toLowerCase()];
        if (direct) return direct;
        return text.split(/(\s*\/\s*|\s*;\s*)/).map((part) => UI_TRANSLATIONS[part.trim().toLowerCase()] || part).join('');
      }
      function providerLabel(value) {
        const key = String(value || '').toLowerCase();
        if (key === 'clinvar') return 'ClinVar临床变异数据库';

        if (key === 'myvariant') return 'MyVariant变异注释';

        if (key === 'ensemblvep' || key === 'vep') return 'Ensembl VEP功能注释';
        if (key === 'mock') return '本地示例库';
        return zh(value);
      }
      function providerShort(value) {
        const key = String(value || '').toLowerCase();
        if (key === 'clinvar') return 'ClinVar';
        if (key === 'civic') return 'CIViC';
        if (key === 'myvariant') return 'MyVariant';
        if (key === 'gnomad') return 'gnomAD';
        if (key === 'ensemblvep' || key === 'vep') return 'VEP';
        if (key === 'uniprot') return 'UniProt';
        if (key === 'oncokb') return 'OncoKB';
        if (key === 'pubmed') return 'PubMed';
        if (key === 'mock') return '本地示例';

      }
      function toneOf(value) {
        const lower = String(value || '').toLowerCase();
        if (lower.includes('refuse')) return 'bad';
        if (lower.includes('ask') || lower.includes('confirm') || lower.includes('downgrade') || lower.includes('ambiguous') || lower.includes('insufficient')) return 'warn';
        return 'ok';
      }
      function variantLabel(v) {
        return [v.gene, v.protein_hgvs || v.cdna_hgvs || v.genomic_hgvs || '未明确位点'].filter(Boolean).join(' ');
      }
      function formatRetrievedAt(value) {
        if (!value) return '-';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return String(value);
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      /* 药物线索 tooltip：研究阶段说明，不构成用药推荐 */
      const TARGET_TIPS = [
        [/BTK/i, '研究线索 · 作用于 BCR / 先天免疫信号下游，本页非治疗推荐。'],
        [/IRAK4/i, '研究线索 · 多处于临床前或早期临床，尚无 DLBCL 获批适应症。'],
        [/SYK/i, '研究线索 · BCR 近端激酶靶点，多处于早期研究阶段。'],
        [/EZH2/i, '研究线索 · 表观遗传靶点，需结合突变功能与疾病背景判断。'],
        [/PARP/i, '治疗线索 · 主要适用于同源重组修复缺陷背景，需经医生确认。'],
        [/IDH/i, '治疗线索 · 适用于相应 IDH 突变背景，需核对适应症。'],
        [/BRAF|MEK|EGFR|ALK|FLT3|PI3K/i, '研究/治疗线索 · 需核对具体变异与获批适应症，不直接等同可用药。'],
      ];
      function targetTip(name) {
        for (const [re, tip] of TARGET_TIPS) if (re.test(name)) return tip;
        return '研究线索 · 尚无本疾病获批适应症，需结合临床判断，本页不构成用药推荐。';
      }
      function targetShort(name) {
        return String(name || '').replace(/（研究线索）/g, '').replace(/（治疗线索）/g, '').trim() || name;
      }

      /* ---------------- 渲染：渐进披露 ---------------- */
      const CHEVRON = '<svg class="me-chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
      const WARN_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:0 0 auto"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';

      function shortMissing(text) {
        const t = String(text || '');
        if (/转录本/i.test(t)) return '转录本 ID';
        if (/基因组坐标|GRCh|genomic/i.test(t)) return '基因组坐标';
        if (/protein_hgvs.*cdna_hgvs|cdna_hgvs.*protein_hgvs/i.test(t)) return '标准 HGVS';
        if (/sample_type|样本/i.test(t)) return '样本类型';
        if (/disease|疾病/i.test(t)) return '疾病背景';

      }

      /* 结论卡：一句话 + 三个指标 */
      function gatePhrase(payload) {
        const g = String(payload.summary?.primary_gate?.decision || payload.summary?.evidence_strength || '');
        if (g === 'downgrade' || g === 'refuse') return '证据强度已降级，不足以支持治疗决策';
        if (g === 'ask_for_confirmation') return '证据需人工确认后再使用';
        if (g === 'allow') return '可作为分子解释参考';
        return '证据有限，需结合临床背景判断';
      }
      function renderVerdict(payload) {
        const summary = payload.summary || {};
        const variants = payload.variants || [];
        const cards = (payload.evidence || []).filter(isDisplayableCard);
        const direct = Number(summary.direct_evidence_count ?? cards.filter((c) => String(c.disease_match || '').includes('直接')).length);
        const total = Number(summary.card_count ?? cards.length);
        const ps = (payload.audit || {}).provider_status || {};
        const names = Object.keys(ps).length ? Object.keys(ps) : ['ClinVar', 'CIViC', 'MyVariant', 'gnomAD', 'EnsemblVEP', 'UniProt', 'OncoKB', 'PubMed'];
        const hit = names.filter((k) => String((ps[k] || {}).state || '') === 'success').length;
        const primary = variants[0] || {};
        const effect = primary?.molecular_annotation?.oncology_effect || '';
        const lead = variants.length
          ? `${escapeHtml(variantLabel(primary))}${effect ? ` 为${escapeHtml(effect)}相关变异` : ''}。现有 <b>${total}</b> 条数据库线索，其中 <b>${direct}</b> 条为 DLBCL 直接证据；${escapeHtml(gatePhrase(payload))}。`

          <div class="me-verdict">
            <div class="me-lead">${lead}</div>
            <div class="me-stats">
              <div class="me-stat"><div class="k">DLBCL 直接证据</div><div class="v ${direct ? 'ok' : ''}">${direct}</div></div>
              <div class="me-stat"><div class="k">证据卡总数</div><div class="v">${total}</div></div>
              <div class="me-stat"><div class="k">数据源命中</div><div class="v">${hit} / ${names.length}</div></div>
            </div>
          </div>`;
      }

      /* 变异卡：默认折叠 */
      function renderVariants(payload) {
        const variants = payload.variants || [];
        if (!variants.length) return '<div class="me-empty">未从输入中识别到标准变异，请补充 HGVS（例如 MYD88 p.L265P）后重试。</div>';
        return variants.map((v, idx) => {
          const ann = v.molecular_annotation || {};
          const site = v.protein_hgvs || v.cdna_hgvs || v.genomic_hgvs || '未明确位点';
          const role = ann.gene_role || ann.oncology_effect || '';
          const s = v.evidence_summary || {};
          const lines = [];
          if (ann.gene_role || ann.oncology_effect) {
            lines.push(`<div class="me-line"><span class="me-k">功能定位</span>${escapeHtml([ann.gene_role, ann.oncology_effect].filter(Boolean).join('，'))}</div>`);
          }

          const downs = normalizeWarnings(ann.downstream_pathways);

          }
          lines.push(`<div class="me-line"><span class="me-k">定位</span>${escapeHtml([v.transcript ? `转录本 ${v.transcript}` : '', v.genome_build || '', v.genomic_hgvs || ''].filter(Boolean).join(' · ')) || '未提供'}</div>`);
          lines.push(`<div class="me-line"><span class="me-k">映射</span>${escapeHtml(zh(v.mapping_status))}${v.gate?.decision ? ` · 门控 ${escapeHtml(zh(v.gate.decision))}` : ''}</div>`);

          <div class="me-block${state.openBlocks.has(key) ? ' open' : ''}">
            <div class="me-head" data-me-key="${key}">
              <span class="me-gene">${escapeHtml(v.gene || '未知基因')} <span class="me-pos">${escapeHtml(site)}</span></span>
              <span class="me-role">${escapeHtml(role)}</span>

            <div class="me-body">${lines.join('')}</div>
          </div>`;
        }).join('');
      }

      /* 完整解读：LLM 报告折叠，避免默认占版面 */
      function renderInterpretation(payload) {
        const raw = String(payload.answer?.markdown || '');
        // 兜底：后端若仍输出「分子诊断报告模板 / 模板 N」样板段，从该处整体截断
        const cut = raw.split(/^#{1,6}\s*分子诊断报告模板|^[\s\-*]*模板\s*\d+\s*[:：]/m)[0];
        // 底部安全条已展示 warnings / missing / gates，完整解读里不再重复这两节
        const DROP_SECTIONS = /^(使用边界|缺失信息)$/;
        const text = cut
          .replace(/^\s*#{1,6}\s*(直接回答|针对临床问题的判断)\s*$/gim, '')
          .split(/\n(?=\s*#{1,6}\s+\S)/)
          .filter((sec) => !DROP_SECTIONS.test(String(sec.match(/^\s*#{1,6}\s+(.+?)\s*$/m)?.[1] || '').trim()))
          .join('\n')
          .replace(/\*\*/g, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
        const next = payload.summary?.recommended_next_step || payload.summary?.next_step;
        if (!text && !next) return '';
        const key = 'answer';
        const body = [
          next ? `<div class="me-line"><span class="me-k">下一步</span>${escapeHtml(next)}</div>` : '',

          `<div class="btn-row" role="toolbar" aria-label="复制操作"><button type="button" class="btn ghost" data-copy-action="summary" ${payload.summary ? '' : 'disabled'}>复制摘要</button><button type="button" class="btn ghost" data-copy-action="answer" ${payload.answer?.markdown ? '' : 'disabled'}>复制结果</button></div>`,
        ].join('');

      /* 证据卡：默认折叠，只留徽章 + 一句话 */
      function isDisplayableCard(card) {
        const status = String(card?.access_status || '').toLowerCase();
        const title = `${card?.source_title || ''} ${card?.source_id || ''}`.toLowerCase();
        if (status === 'not_accessible' || status === 'query_error') return false;
        if (title.includes('query error') || title.includes('query_error')) return false;

      }
      function dedupeCards(cards) {
        const seen = new Set(); const out = [];
        (cards || []).forEach((card) => {
          const key = [card?.variant_id || '', String(card?.provider || '').toLowerCase(), String(card?.source_title || '').trim(), String(card?.claim || '').trim(), String(card?.evidence_level || '').toUpperCase(), String(card?.disease_match || '').trim()].join('|');
          if (seen.has(key)) return; seen.add(key); out.push(card);

      function cardMatchesFilter(card) {

        return true;
      }
      function renderFilters(payload) {
        const cards = dedupeCards((payload.evidence || []).filter(isDisplayableCard));
        const direct = cards.filter((c) => String(c.disease_match || '').includes('直接')).length;
        const proxy = cards.filter((c) => /外推|近似/.test(String(c.disease_match || ''))).length;
        const caution = cards.filter((c) => ['downgrade', 'refuse', 'ask_for_confirmation'].includes(String(c.gate?.decision || ''))).length;
        const filters = [['all', `全部 ${cards.length}`], ['direct', `DLBCL 直接 ${direct}`], ['proxy', `外推 ${proxy}`], ['caution', `需谨慎 ${caution}`]];
        return `<div class="me-filters">${filters.map(([k, l]) => `<button type="button" class="${state.cardFilter === k ? 'active' : ''}" data-card-filter="${k}">${l}</button>`).join('')}</div>`;
      }
      function renderEvidence(payload) {
        const allCards = dedupeCards((payload.evidence || []).filter(isDisplayableCard));
        const cards = allCards.filter(cardMatchesFilter);
        if (!allCards.length) return '<div class="me-empty">暂无可展示证据卡。未检索到记录 ≠ 该变异无临床意义，请结合数据源状态判断。</div>';
        if (!cards.length) return '<div class="me-empty">当前筛选条件下没有证据卡。</div>';
        return cards.map((card, i) => {
          const dm = String(card.disease_match || '');
          const dCls = dm.includes('直接') ? 'direct' : (/外推|近似/.test(dm) ? 'proxy' : 'note');
          const dText = dm.includes('直接') ? '直接' : (dm.includes('近似') ? '近似' : (dm.includes('外推') ? '外推' : '注释'));
          const details = [];
          if (card.source_id) details.push(`<div class="me-line"><span class="me-k">来源</span>${escapeHtml(card.source_id)}${card.amp_tier ? ` · AMP ${escapeHtml(card.amp_tier)}` : ''}${card.escat_level ? ` · ESCAT ${escapeHtml(card.escat_level)}` : ''}</div>`);
          if (card.matched_variant) details.push(`<div class="me-line"><span class="me-k">匹配变异</span>${escapeHtml(card.matched_variant)}</div>`);
          if (card.drug) details.push(`<div class="me-line"><span class="me-k">相关药物</span>${escapeHtml(zh(card.drug))}</div>`);
          if (card.limitations) details.push(`<div class="me-line"><span class="me-k">局限性</span>${escapeHtml(card.limitations)}</div>`);
          if (card.population) details.push(`<div class="me-line"><span class="me-k">人群</span>${escapeHtml(card.population)}</div>`);
          if (card.conflict?.has_conflict) details.push(`<div class="me-line" style="color:var(--danger-text)"><span class="me-k">冲突</span>${escapeHtml(card.conflict.description || '存在未解决冲突')}</div>`);
          if (card.source_url) details.push(`<div class="me-line"><a href="${escapeHtml(card.source_url)}" target="_blank" rel="noopener noreferrer">打开来源 →</a></div>`);

          return `
          <div class="me-block${state.openBlocks.has(key) ? ' open' : ''}">
            <div class="me-head" data-me-key="${key}">

              <span class="me-badge l">${escapeHtml(card.evidence_level || '-')}</span>
              <span class="me-badge ${dCls}">${dText}</span>
              <div class="me-claim">${escapeHtml(card.claim || '')}</div>
              ${CHEVRON}
            </div>
            <div class="me-body">${details.join('') || '<div class="me-line">该证据卡未提供更多字段。</div>'}</div>
          </div>`;
        }).join('');
      }

      /* 安全边界：一条警告条，门控与缺失信息折叠在内 */
      function renderSafety(payload) {
        const gates = [...(payload.safety?.variant_gates || []), ...(payload.safety?.card_gates || [])].filter((gate) => {
          const reasons = normalizeWarnings(gate.reasons || []).join(' ').toLowerCase();
          return !reasons.includes('query error') && !reasons.includes('查询错误') && !reasons.includes('查询失败');
        });
        const blocked = new Set();
        gates.forEach((g) => normalizeWarnings(g.blocked_outputs).forEach((b) => blocked.add(zh(b))));
        const blockedList = [...blocked].slice(0, 6);
        const warnings = normalizeWarnings(payload.global_warnings);
        const missing = payload.missing || {};
        const blocking = normalizeWarnings(missing.blocking);
        const advisory = normalizeWarnings(missing.advisory);
        const head = warnings.length ? warnings.slice(0, 2).join(' · ') : '仅用于分子证据解释，不构成患者级诊断或治疗建议';
        const lines = [];
        if (blockedList.length) lines.push(`<div class="me-line"><span class="me-k">阻断输出</span>${escapeHtml(blockedList.join('、'))}</div>`);
        warnings.slice(2).forEach((w) => lines.push(`<div class="me-line">${escapeHtml(w)}</div>`));
        if (blocking.length) lines.push(`<div class="me-line"><span class="me-k">需补充</span>${escapeHtml(blocking.map(shortMissing).join('、'))}</div>`);
        if (advisory.length) lines.push(`<div class="me-line"><span class="me-k">建议补充</span>${escapeHtml(advisory.map(shortMissing).join('、'))}</div>`);
        if (!lines.length) lines.push('<div class="me-line">当前门控均为允许，无阻断项。</div>');
        const key = 'gate';
        return `
          <div class="me-block me-warn${state.openBlocks.has(key) ? ' open' : ''}">
            <div class="me-head" data-me-key="${key}">
              ${WARN_ICON}
              <div style="flex:1;min-width:0">${escapeHtml(head)}</div>
              <span class="me-more">${gates.length} 项门控</span>
              ${CHEVRON}
            </div>
            <div class="me-body">${lines.join('')}</div>
          </div>`;
      }

      /* ---------------- 主渲染 ---------------- */
      function renderResult(payload) {
        state.lastPayload = payload;
        els.emptyState.hidden = true;
        els.resultStack.hidden = false;
        const variants = payload.variants || [];
        const cards = (payload.evidence || []).filter(isDisplayableCard);
        const gates = [...(payload.safety?.variant_gates || []), ...(payload.safety?.card_gates || [])];
        const warnCount = gates.filter((g) => g.decision === 'downgrade' || g.decision === 'ask_for_confirmation' || g.decision === 'refuse').length;
        const gateState = warnCount ? '保守 · 需注意' : (gates.some((g) => g.decision === 'allow') ? '允许 · 可参考' : '未知');
        els.heroStateBadge.textContent = gateState;
        els.heroStateBadge.className = `chip ${warnCount ? 'warn' : 'ok'}`;
        els.heroMeta.textContent = `检索时间 ${formatRetrievedAt(payload.meta?.retrieved_at)} · ${zh(payload.meta?.provider_mode)}`;
        const label = variants.length ? variants.map(variantLabel).slice(0, 2).join(' / ') : '分子证据';
        els.topTitle.textContent = `分子证据 · ${label}`;
        if (!['all', 'direct', 'proxy', 'caution'].includes(state.cardFilter)) state.cardFilter = 'all';
        els.resultStack.innerHTML =
          renderVerdict(payload) +
          renderVariants(payload) +
          (cards.length ? renderFilters(payload) + renderEvidence(payload) : '') +
          renderInterpretation(payload) +
          renderSafety(payload) +
          renderBackToQA(payload);
        bindDynamic();
      }
      // Send the same variants back to the guideline Q&A page so the doctor can
      // ask "should this change my treatment choice?" with context preserved.
      function renderBackToQA(payload) {
        const variants = payload.variants || [];
        if (!variants.length) return '';
        const labels = variants.map(variantLabel).slice(0, 3).join(', ');
        const href = './index.html?q=' + encodeURIComponent(`${labels} 对 DLBCL 治疗选择有什么影响？`);
        return `<div class="me-foot">
          <span>已识别变异：${escapeHtml(labels)}</span>
          <a class="btn ghost" href="${escapeHtml(href)}">带着这些变异去问指南问答</a>
        </div>`;
      }
      function bindDynamic() {
        els.resultStack.querySelectorAll('[data-card-filter]').forEach((btn) => {
          btn.addEventListener('click', () => { state.cardFilter = btn.dataset.cardFilter || 'all'; if (state.lastPayload) renderResult(state.lastPayload); });
        });
        els.resultStack.querySelectorAll('[data-me-key]').forEach((head) => {
          head.addEventListener('click', () => {
            const block = head.closest('.me-block'); if (!block) return;
            const key = head.getAttribute('data-me-key');
            const open = block.classList.toggle('open');
            if (open) state.openBlocks.add(key); else state.openBlocks.delete(key);
          });
        });
      }

      /* ---------------- 历史 ---------------- */
      function emptyPayload() {
        return { meta: {}, variants: [], evidence: [], safety: { variant_gates: [], card_gates: [] }, answer: {}, summary: {}, missing: { blocking: [], advisory: [] }, global_warnings: [], audit: { provider_status: {} } };
      }
      function renderHistory() {
        const list = state.history || [];
        if (!list.length) { els.historyList.innerHTML = '<div class="hist-empty">暂无历史，查询后自动保存到本地。</div>'; return; }
        els.historyList.innerHTML = list.map((item, idx) => `
          <div class="hist-item ${idx === 0 ? 'active' : ''}" data-history-index="${idx}" title="${escapeHtml(item.variantsText || '')}">
            ${escapeHtml(item.label || '未命名查询')}
            <span class="hm">${escapeHtml(formatRetrievedAt(item.retrieved_at))} · ${escapeHtml(String(item.variantCount ?? 0))} 变异 · ${escapeHtml(String(item.evidenceCount ?? 0))} 证据</span>
          </div>`).join('');
      }
      function addHistoryEntry(payload, variantsText) {
        const gates = [...(payload.safety?.variant_gates || []), ...(payload.safety?.card_gates || [])];
        const warnCount = gates.filter((g) => g.decision === 'downgrade' || g.decision === 'ask_for_confirmation' || g.decision === 'refuse').length;
        const entry = {
          label: String(variantsText || '分子证据查询').slice(0, 40),
          variantsText: String(variantsText || '').slice(0, 200),
          retrieved_at: payload.meta?.retrieved_at || new Date().toISOString(),
          variantCount: (payload.variants || []).length,
          evidenceCount: (payload.evidence || []).length,
          gateState: warnCount ? 'warn' : 'ok',
          payload,
        };
        state.history = [entry, ...state.history.filter((item) => item.retrieved_at !== entry.retrieved_at)].slice(0, HISTORY_LIMIT);
        try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history)); } catch { /* ignore */ }
        renderHistory();
      }
      function loadHistory() {
        try {
          const raw = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
          state.history = Array.isArray(raw) ? raw : [];
        } catch { state.history = []; }
        renderHistory();
      }

      /* ---------------- 复制 ---------------- */
      async function copyText(text, btn, label) {
        try {
          await navigator.clipboard.writeText(text);
          btn.textContent = '已复制';
          setTimeout(() => { btn.textContent = label; }, 1200);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
          btn.textContent = '已复制';
          setTimeout(() => { btn.textContent = label; }, 1200);
        }
      }
      els.resultStack.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-copy-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-copy-action');
        if (action === 'answer' && state.lastPayload?.answer?.markdown) copyText(state.lastPayload.answer.markdown, btn, '复制结果');
        else if (action === 'summary' && state.lastPayload?.summary) {
          const s = state.lastPayload.summary;
          copyText([`医生摘要：${s.conclusion || '—'}`, `优先动作：${s.priority_action || '—'}`, `下一步：${s.recommended_next_step || s.next_step || '—'}`, `变异数：${s.variant_count ?? 0}；证据卡：${s.card_count ?? 0}`].join('\n'), btn, '复制摘要');
        }
      });
      els.historyList.addEventListener('click', (e) => {
        const card = e.target.closest('.hist-item');
        if (!card || card.dataset.historyIndex === undefined) return;
        const item = state.history[Number(card.dataset.historyIndex)];
        if (!item?.payload) return;
        els.historyList.querySelectorAll('.hist-item').forEach((el) => el.classList.remove('active'));
        card.classList.add('active');
        state.openBlocks = new Set();
        renderResult(item.payload);
      });

      /* ---------------- 顶部按钮 ---------------- */
      els.newChatBtn.addEventListener('click', () => {
        state.lastPayload = null; state.cardFilter = 'all'; state.openBlocks = new Set();
        els.resultStack.hidden = true; els.resultStack.innerHTML = '';
        els.emptyState.hidden = false;
        els.topTitle.textContent = '分子证据 · 等待查询';
        els.heroStateBadge.textContent = '等待查询'; els.heroStateBadge.className = 'chip gray';
        els.heroMeta.textContent = '输入分子信息，例如 MYD88 p.L265P, CD79B p.Y196H…';
        els.composerText.value = ''; els.composerText.focus();
        toast('已开始新对话');
      });
      els.clearHistoryBtn.addEventListener('click', () => {
        if (!state.history.length) { toast('暂无历史可清空'); return; }
        if (!confirm('确认清空所有本地查询历史？')) return;
        state.history = [];
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
      });
      els.loginBtn.addEventListener('click', () => toast('登录 / 注册（演示）'));
      els.shareBtn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(location.href); toast('分享链接已复制'); }
        catch { toast('分享链接复制失败'); }
      });
      els.historyToggleBtn.addEventListener('click', () => {
        if (document.querySelector('.app')?.classList.contains('sidebar-collapsed')) setSidebarCollapsed(false);
        document.querySelector('.sidebar')?.scrollIntoView({ behavior: 'smooth' });
        toast(state.history.length ? `共 ${state.history.length} 条历史（见左侧栏）` : '暂无历史记录');
      });

      /* ---------------- 侧边栏收起 / 展开 ---------------- */
      const SIDEBAR_KEY = 'gf_me_sidebar_collapsed';
      function setSidebarCollapsed(collapsed) {
        document.querySelector('.app')?.classList.toggle('sidebar-collapsed', collapsed);
        els.sidebarCollapseBtn?.setAttribute('aria-expanded', String(!collapsed));
        try { localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0'); } catch { /* ignore */ }
      }
      els.sidebarCollapseBtn?.addEventListener('click', () => setSidebarCollapsed(true));
      els.sidebarExpandBtn?.addEventListener('click', () => setSidebarCollapsed(false));
      try {
        if (localStorage.getItem(SIDEBAR_KEY) === '1') setSidebarCollapsed(true);
      } catch { /* ignore */ }

      /* ---------------- 参数面板 ---------------- */
      function currentParamSummary() {
        return { disease: els.disease.value || 'DLBCL', sample: els.sampleType.value || 'tumor tissue', mode: els.providerMode.value || 'live' };
      }
      function syncParamChip() {
        const p = currentParamSummary();
        if (els.diseaseChip) els.diseaseChip.textContent = `疾病 ${p.disease}`;
        if (els.sampleChip) els.sampleChip.textContent = `样本 ${p.sample}`;
        if (els.modeChip) els.modeChip.textContent = `模式 ${p.mode}`;
      }
      function setSettingsOpen(open) { els.settingsPanel.hidden = !open; }
      [els.diseaseChip, els.sampleChip, els.modeChip].forEach((chip) => {
        chip?.addEventListener('click', (e) => { e.stopPropagation(); setSettingsOpen(els.settingsPanel.hidden); });
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.composer-box') && !els.settingsPanel.hidden) setSettingsOpen(false);
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !els.settingsPanel.hidden) setSettingsOpen(false); });
      ['disease', 'sampleType', 'genomeBuild', 'transcript', 'variantType', 'providerMode'].forEach((id) => {
        els[id]?.addEventListener('change', syncParamChip);
        els[id]?.addEventListener('input', syncParamChip);
      });
      syncParamChip();

      /* ---------------- OCR ---------------- */
      async function uploadReportForOcr(file) {
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        els.composerStatus.textContent = `正在识别 ${file.name}…`;
        els.composerStatus.classList.remove('err');
        try {
          const resp = await fetch(`${API_BASE}/api/molecular-evidence/ocr`, { method: 'POST', credentials: 'include', body: formData });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(data.detail || 'OCR 失败');
          if (data.text) {
            els.composerText.value = data.text;
            els.composerText.style.height = 'auto';
            els.composerText.style.height = Math.min(160, Math.max(30, els.composerText.scrollHeight)) + 'px';
            setError('');
            els.composerStatus.textContent = `${data.message || 'OCR 已完成'} 请核对文字后发送。`;
          } else {
            els.composerStatus.textContent = data.message || 'OCR 未获得文字，请改用文字粘贴。';
          }
        } catch (err) {
          els.composerStatus.textContent = `OCR 失败：${String(err?.message || err)}`;
          els.composerStatus.classList.add('err');
        } finally {
          els.reportImageInput.value = '';
        }
      }
      els.composerAddBtn.addEventListener('click', () => els.reportImageInput.click());
      els.reportImageInput.addEventListener('change', (e) => uploadReportForOcr(e.target.files?.[0]));

      /* ---------------- 查询 ---------------- */
      function currentVariantsText() { return String(els.composerText.value || '').trim(); }
      function setLoading(isLoading) {
        els.composerSendBtn.disabled = isLoading;
        els.composerSendBtn.textContent = isLoading ? '…' : '➤';
        if (isLoading) { els.composerStatus.textContent = '正在标准化变异、检索证据并生成分析结果…'; els.composerStatus.classList.remove('err'); }
        else if (state.lastPayload) { els.composerStatus.textContent = '分析完成，可继续输入新的分子信息。'; }
      }
      async function submitQuery() {
        const variantsText = currentVariantsText();
        if (!variantsText) {
          setError('请输入分子信息，例如 MYD88 p.L265P, CD79B p.Y196H。');
          els.composerText.focus();
          return;
        }
        setLoading(true);
        try {
          const resp = await api('/api/molecular-evidence/query', {
            method: 'POST',
            body: JSON.stringify({
              variants_text: variantsText,
              disease: els.disease.value || 'DLBCL',
              sample_type: els.sampleType.value || 'tumor tissue',
              genome_build: (els.genomeBuild.value || '').trim() || null,
              transcript: (els.transcript.value || '').trim() || null,
              variant_type: (els.variantType.value || '').trim() || null,
              question: null,
              provider_mode: els.providerMode.value || 'live',
            }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) {
            const detail = Array.isArray(data.detail)
              ? data.detail.map((d) => d.msg || JSON.stringify(d)).join('；')
              : (data.detail || data.message || '查询失败');
            setError(detail);
            return;
          }
          state.cardFilter = 'all';
          state.openBlocks = new Set();
          renderResult(data);
          els.composerText.value = '';
          els.composerText.style.height = '30px';
          addHistoryEntry(data, variantsText);
          setError('');
          els.composerStatus.textContent = '分析完成，可继续输入新的分子信息。';
          $('content').scrollTo?.(0, 0);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          setError(`网络错误：${String(err?.message || err)}`);
        } finally {
          setLoading(false);
        }
      }
      els.composerSendBtn.addEventListener('click', submitQuery);
      els.composerText.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); submitQuery(); }
      });
      els.composerText.addEventListener('input', () => {
        els.composerText.style.height = 'auto';
        els.composerText.style.height = Math.min(160, Math.max(30, els.composerText.scrollHeight)) + 'px';
      });

      /* ---------------- 初始化 ---------------- */
      loadHistory();

      /* ---------------- 深链：主问答页跳转过来时预填并自动运行 ---------------- */
      function applyDeepLinkFromQA() {
        const params = new URLSearchParams(location.search || '');
        const variants = (params.get('variants') || '').trim();
        const disease = (params.get('disease') || '').trim();
        const mode = (params.get('mode') || '').trim();
        const pick = (select, value) => {
          if (!select || !value) return;
          const hit = Array.from(select.options || []).find((o) => o.value === value);
          if (hit) select.value = value;
        };
        pick(els.disease, disease);
        pick(els.providerMode, mode);
        syncParamChip();
        if (!variants) return false;
        els.composerText.value = variants;
        els.composerText.style.height = 'auto';
        els.composerText.style.height = Math.min(160, Math.max(30, els.composerText.scrollHeight)) + 'px';
        if (params.get('autorun') === '1') submitQuery();
        return true;
      }
      applyDeepLinkFromQA();
    })();
  </script>
</body>
</html>
